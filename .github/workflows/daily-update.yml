name: Daily Update and Auto-Merge PR

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      UPDATE_BRANCH_PREFIX: scoop-update-

    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyquery

      - name: Configure Git
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge previous auto-update PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY_BRANCH="${UPDATE_BRANCH_PREFIX}$(date -u +%F)"
          echo "Merging auto-update PRs older than today's branch: $TODAY_BRANCH"

          pr_list=$(gh pr list \
            --state open \
            --base master \
            --search "Auto update in:title" \
            --json number,headRefName,createdAt \
            --jq ".[] | select(.headRefName | startswith(\"$UPDATE_BRANCH_PREFIX\")) | select(.headRefName != \"$TODAY_BRANCH\") | [.number, .headRefName, .createdAt] | @tsv")

          if [ -z "$pr_list" ]; then
            echo "No previous auto-update PRs found."
          else
            echo "$pr_list" | while IFS=$'\t' read -r number branch created; do
              echo "Merging PR #$number from $branch (created $created)..."
              if ! merge_output=$(gh pr merge "$number" --squash --delete-branch 2>&1); then
                echo "$merge_output"
                if echo "$merge_output" | grep -qiE "merge conflicts|not mergeable|mergePullRequest"; then
                  echo "::warning::PR #$number has merge conflicts; closing it and deleting its branch."
                  gh pr close "$number" \
                    --delete-branch \
                    --comment "Closing stale auto-update PR because it has merge conflicts. A later run will recreate updates from latest master."
                  continue
                fi
                exit 1
              fi
            done
          fi

          git fetch origin "+master:refs/remotes/origin/master"
          git checkout master
          git reset --hard origin/master

      - name: Prepare today's update branch
        run: |
          BRANCH_NAME="${UPDATE_BRANCH_PREFIX}$(date -u +%F)"
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

          if git ls-remote --heads origin "$BRANCH_NAME" | grep "$BRANCH_NAME" > /dev/null; then
            echo "Using existing branch $BRANCH_NAME"
            git fetch origin "+$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
            git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
            git merge --no-edit origin/master
          else
            echo "Creating branch $BRANCH_NAME from latest master"
            git checkout -B "$BRANCH_NAME" origin/master
          fi

      - name: Run auto_scoop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_APPS: 20
        run: python auto_scoop.py

      - name: Commit generated manifests
        id: branch_status
        run: |
          if [ -n "$(git status --porcelain bucket/)" ]; then
            git add bucket/
            git commit -m "🤖 Add new apps on $(date -u +%F)"
          fi

          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH_NAME"; then
            ahead=$(git rev-list --count "origin/$BRANCH_NAME..HEAD")
          else
            ahead=$(git rev-list --count "origin/master..HEAD")
          fi

          if [ "$ahead" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push today's update branch
        if: steps.branch_status.outputs.changed == 'true'
        run: |
          git push origin "$BRANCH_NAME" --force-with-lease

      - name: Create Pull Request (if not exists)
        if: steps.branch_status.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --state open --base master --head "$BRANCH_NAME" --json number -q '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for $BRANCH_NAME, no new PR created."
          else
            gh pr create \
              --base master \
              --head "$BRANCH_NAME" \
              --title "Auto update $(date -u +%F)" \
              --body "## 🔄 自动更新

              从 GitHub Trending 新增的应用 manifest。同一天内多次运行会累积到此 PR。

              ⏳ 今天暂不自动合并；下一天运行时会先合并此 PR，再生成新的更新。"
          fi
