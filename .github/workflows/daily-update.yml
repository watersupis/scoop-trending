name: Daily Update and Auto-Merge PR

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      AUTO_MERGE_DAYS: 3

    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyquery

      - name: Run auto_scoop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_APPS: 20
        run: python auto_scoop.py

      - name: Check for new manifest files
        id: git_status
        run: |
          if [ -z "$(git status --porcelain bucket/)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push to auto-update branch
        if: steps.git_status.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="scoop-auto-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 暂存新生成的文件，保证切换分支时工作区干净
          git stash push --include-untracked -m "temp for branch switch"

          # 记录远程分支当前状态，保护后续 force-with-lease
          if git ls-remote --heads origin "$BRANCH_NAME" | grep "$BRANCH_NAME" > /dev/null; then
            git fetch origin "+$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
          fi

          # 每次从最新 master 重建滚动分支，避免多个日期分支互相产生 merge conflicts
          git checkout -B "$BRANCH_NAME" master

          # 恢复之前暂存的新文件
          git stash pop

          # 添加并提交新 manifest
          git add bucket/
          git commit -m "🤖 Add new apps on $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push origin "$BRANCH_NAME" --force-with-lease

      - name: Create Pull Request (if not exists)
        if: steps.git_status.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="scoop-auto-update"
          EXISTING_PR=$(gh pr list --state open --base master --head "$BRANCH_NAME" --json number -q '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for $BRANCH_NAME, no new PR created."
          else
            gh pr create \
              --base master \
              --head "$BRANCH_NAME" \
              --title "Auto update $(date +%Y-%m-%d)" \
              --body "## 🔄 自动更新

              从 GitHub Trending 新增的应用 manifest。此 PR 会滚动更新，并始终从最新 master 重建以避免合并冲突。

              ⏳ 管理员可在 ${AUTO_MERGE_DAYS} 天内自由修改，到期将自动合并。"
          fi

      - name: Close stale auto-update PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_BRANCH="scoop-auto-update"
          stale_prs=$(gh pr list \
            --state open \
            --base master \
            --search "Auto update in:title" \
            --json number,headRefName \
            --jq ".[] | select(.headRefName != \"$CURRENT_BRANCH\") | [.number, .headRefName] | @tsv")

          if [ -z "$stale_prs" ]; then
            echo "No stale auto-update PRs found."
            exit 0
          fi

          echo "$stale_prs" | while IFS=$'\t' read -r number branch; do
            echo "Closing stale PR #$number from $branch..."
            gh pr close "$number" \
              --delete-branch \
              --comment "Closing stale per-day auto-update PR. The rolling auto-update PR is rebuilt from latest master to avoid merge conflicts."
          done

      - name: Auto-merge old PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for auto-update PRs older than $AUTO_MERGE_DAYS days..."
          pr_list=$(gh pr list --state open --base master --head scoop-auto-update --search "Auto update in:title" --json number,createdAt --jq '.')
          if [ -z "$pr_list" ] || [ "$pr_list" == "[]" ]; then
            echo "No auto-update PRs found."
            exit 0
          fi
          echo "$pr_list" | jq -c '.[]' | while read -r pr; do
            number=$(echo "$pr" | jq -r '.number')
            created=$(echo "$pr" | jq -r '.createdAt')
            created_ts=$(date -d "$created" +%s 2>/dev/null || date -u -jf "%Y-%m-%dT%H:%M:%SZ" "$created" +%s)
            current_ts=$(date -u +%s)
            days=$(( (current_ts - created_ts) / 86400 ))
            if [ "$days" -ge "$AUTO_MERGE_DAYS" ]; then
              echo "🔀 Merging PR #$number (created $created, $days days ago)..."
              if ! merge_output=$(gh pr merge "$number" --squash --delete-branch 2>&1); then
                echo "$merge_output"
                if echo "$merge_output" | grep -qiE "merge conflicts|not mergeable|mergePullRequest"; then
                  echo "::warning::PR #$number has merge conflicts; closing it and deleting its branch."
                  gh pr close "$number" \
                    --delete-branch \
                    --comment "Closing stale auto-update PR because it has merge conflicts. The next scheduled run will recreate it from latest master."
                  continue
                fi
                exit 1
              fi
            else
              echo "⏳ PR #$number is $days days old, will merge after $AUTO_MERGE_DAYS days."
            fi
          done
