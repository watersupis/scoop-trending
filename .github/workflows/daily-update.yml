name: Daily Update and Auto-Merge PR

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      AUTO_MERGE_DAYS: 3

    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyquery

      - name: Run auto_scoop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_APPS: 3
        run: python auto_scoop.py

      - name: Check for new manifest files
        id: git_status
        run: |
          if [ -z "$(git status --porcelain bucket/)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push to daily branch
        if: steps.git_status.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="scoop-update-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 暂存新生成的文件，保证切换分支时工作区干净
          git stash push --include-untracked -m "temp for branch switch"

          # 检查远程是否已有该日期的分支
          if git ls-remote --heads origin "$BRANCH_NAME" | grep "$BRANCH_NAME" > /dev/null; then
            echo "Branch $BRANCH_NAME already exists, checking out..."
            git fetch origin "$BRANCH_NAME"
            git checkout "$BRANCH_NAME"
            # 合并 master 最新内容
            git merge master --no-edit || echo "Merge with master failed, continuing anyway..."
          else
            echo "Creating new branch $BRANCH_NAME"
            git checkout -b "$BRANCH_NAME"
          fi

          # 恢复之前暂存的新文件
          git stash pop || echo "No stash to pop"

          # 添加并提交新 manifest
          git add bucket/
          git commit -m "🤖 Add new apps on $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push origin "$BRANCH_NAME" --force-with-lease

      - name: Create Pull Request (if not exists)
        if: steps.git_status.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="scoop-update-$(date +%Y-%m-%d)"
          EXISTING_PR=$(gh pr list --state open --base master --head "$BRANCH_NAME" --json number -q '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for $BRANCH_NAME, no new PR created."
          else
            gh pr create \
              --base master \
              --head "$BRANCH_NAME" \
              --title "Auto update $(date +%Y-%m-%d)" \
              --body "## 🔄 自动更新

              今日从 GitHub Trending 新增的应用 manifest。同一天的多次更新都会累积到此 PR。

              ⏳ 管理员可在 ${AUTO_MERGE_DAYS} 天内自由修改，到期将自动合并。"
          fi

      - name: Auto-merge old PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for auto-update PRs older than $AUTO_MERGE_DAYS days..."
          pr_list=$(gh pr list --state open --base master --search "Auto update in:title" --json number,createdAt --jq '.')
          if [ -z "$pr_list" ] || [ "$pr_list" == "[]" ]; then
            echo "No auto-update PRs found."
            exit 0
          fi
          echo "$pr_list" | jq -c '.[]' | while read -r pr; do
            number=$(echo "$pr" | jq -r '.number')
            created=$(echo "$pr" | jq -r '.createdAt')
            created_ts=$(date -d "$created" +%s 2>/dev/null || date -u -jf "%Y-%m-%dT%H:%M:%SZ" "$created" +%s)
            current_ts=$(date -u +%s)
            days=$(( (current_ts - created_ts) / 86400 ))
            if [ "$days" -ge "$AUTO_MERGE_DAYS" ]; then
              echo "🔀 Merging PR #$number (created $created, $days days ago)..."
              gh pr merge "$number" --squash --delete-branch
            else
              echo "⏳ PR #$number is $days days old, will merge after $AUTO_MERGE_DAYS days."
            fi
          done
